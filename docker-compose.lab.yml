# Mailcow lab override: bind every public-facing port to loopback only.
#
# Usage, from a mailcow-dockerized checkout:
#   docker compose -f docker-compose.yml -f docker-compose.lab.yml up -d
#
# This file is for isolated labs. Do not deploy it to production.

services:
  nginx-mailcow:
    ports: !override
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"

  postfix-mailcow:
    ports: !override
      - "127.0.0.1:25:25"
      - "127.0.0.1:465:465"
      - "127.0.0.1:587:587"

  dovecot-mailcow:
    ports: !override
      - "127.0.0.1:993:993"
      - "127.0.0.1:995:995"

  netfilter-mailcow:
    environment:
      DISABLE_NETFILTER: "1"
